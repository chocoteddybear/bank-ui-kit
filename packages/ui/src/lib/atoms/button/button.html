<button
  class="button"
  [class]="classes()"
  [type]="type()"
  [disabled]="disabled()"
  [attr.form]="form() ?? null"
  [attr.aria-label]="ariaLabel() || null"
  [attr.aria-disabled]="loading() ? 'true' : null"
  [attr.aria-busy]="loading() ? 'true' : null"
>
  @if (loading()) {
    <span class="spinner" aria-hidden="true"></span>
  }
  <span class="label" #label><ng-content /></span>
</button>
